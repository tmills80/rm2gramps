[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rm2gramps"
version = "0.3.0"
description = "Convert RootsMagic 11 .rmtree SQLite databases to Gramps XML .gramps files."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["rmread>=0.0.2"]

[project.optional-dependencies]
# Test-only. rmread is a runtime dependency of this tool already; the
# group exists so `pip install -e ".[test]"` pulls in the test runner
# alongside it.
test = [
    "pytest>=8",
]

[project.scripts]
rm2gramps = "rm2gramps.cli.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# rmread is not on PyPI. Until it is published, resolve it from the
# sibling checkout. Delete this block once rmread is released and
# `dependencies = ["rmread>=0.0.2"]` can be resolved from an index.
rmread = { path = "../rmread", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]